# MONITORS
# https://wiki.hyprland.org/Configuring/Monitors
$m1 = DP-2
$m2 = DP-1

monitor = $m1, 2560x1440@144, 0x0, 1
monitor = $m2, 1920x1080, 2560x0, 1

# PROGRAMS
$terminal = alacritty
$fileManager = nautilus
$menu = wofi --show drun

# AUTOSTART
exec-once = nm-applet &
exec-once = waybar & hyprpaper


# ENVIRONMENT VARIABLES
env = HYPRCURSOR_THEME,rose-pine-hyprcursor
env = XCURSOR_THEME,rose-pine-hyprcursor
env = XCURSOR_SIZE,24  # Adjust the size if needed
# env = XCURSOR_SIZE,2
# env = HYPRCURSOR_SIZE,2

#env = XDG_DATA_DIRS,'/var/lib/flatpak/exports/share:/usr/local/share:/usr/share'

# LOOK AND FEEL
# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 5
    gaps_out = 10
    
    # border_size = 2
    # col.active_border = 0xffcba6f7
    # col.inactive_border = 0xff313244
    border_size = 2
    col.active_border = 0xff00ffff
    col.inactive_border = 0xff00aaaa

    resize_on_border = true
    allow_tearing = false

    layout = dwindle
}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {

    #rounding = 5
    active_opacity = 1.0
    inactive_opacity = 1.0

    blur {
        enabled = false
    }

    shadow {
        enabled = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = true
    bezier = myBezier, 0.23, 1, 0.32, 1
    animation = windows, 1, 7, myBezier
    animation = windowsOut, 1, 2, default, popin 80%
    animation = border, 1, 2, default
    animation = borderangle, 1, 2, default
    animation = fade, 1, 2, default
    animation = workspaces, 1, 2, default
}

# https://wiki.hyprland.org/Configuring/Dwindle-Layout
dwindle {
    pseudotile = true
    preserve_split = true
}

# https://wiki.hyprland.org/Configuring/Master-Layout
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

# INPUT
# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    sensitivity = 0
    force_no_accel = true

    touchpad {
        natural_scroll = false
    }
}

# https://wiki.hyprland.org/Configuring/Variables/#gestures
gestures {
    workspace_swipe = false
}

# KEYBINDINGS
# https://wiki.hyprland.org/Configuring/Keywords
$mod = SUPER

# https://wiki.hyprland.org/Configuring/Binds
bind = $mod, RETURN, exec, $terminal
bind = $mod, Q, killactive,
bind = $mod, M, exit,
bind = $mod, F, exec, $fileManager
bind = $mod, V, togglefloating
bind = $mod, D, exec, $menu
bind = $mod, P, pseudo, # dwindle
bind = $mod, J, togglesplit, # dwindle

bind = $mod, G, fullscreen

# Screenshot a window
bind = $mod, PRINT, exec, hyprshot -m window --clipboard-only
# Screenshot a monitor
bind = , PRINT, exec, hyprshot -m output --clipboard-only
# Screenshot a region
layerrule = noanim, selection
layerrule = noanim, hyprpicker
bind = $mod SHIFT, S, exec, hyprshot -m region --clipboard-only

# Move focus with mod
bind = $mod, H, movefocus, l
bind = $mod, L, movefocus, r
bind = $mod, K, movefocus, u
bind = $mod, J, movefocus, d

# Move focus with mod + arrow keys
bind = $mod, left, movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up, movefocus, u
bind = $mod, down, movefocus, d

bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, L, movewindow, r

# Switch workspaces with mod + [0-9]
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod, 0, workspace, 10

# Move active window to a workspace with mod + SHIFT + [0-9]
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod SHIFT, 0, movetoworkspace, 10

# Move/resize windows with mod + LMB/RMB and dragging
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
# bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
# bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
